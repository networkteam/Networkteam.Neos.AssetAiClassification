name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Neos ${{ matrix.neos-version }}, PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keeps the Neos 8 jobs on the PHPUnit version Neos 8 projects use
          - neos-version: '8.4'
            php-version: '8.2'
            dev-constraints: '--with neos/buildessentials:~8.3.0 --with phpunit/phpunit:~9.6'
          - neos-version: '8.4'
            php-version: '8.3'
            dev-constraints: '--with neos/buildessentials:~8.3.0 --with phpunit/phpunit:~9.6'
          # Neos 9.2 requires PHP 8.4 and a package providing neos/contentrepositoryregistry-storageclient
          - neos-version: '9.2'
            php-version: '8.4'
            additional-packages: 'neos/contentgraph-doctrinedbaladapter:~9.2.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - run: composer validate --strict

      - run: >
          composer require --no-update --no-interaction
          neos/neos:~${{ matrix.neos-version }}.0
          neos/media-browser:~${{ matrix.neos-version }}.0
          neos/fusion:~${{ matrix.neos-version }}.0
          ${{ matrix.additional-packages }}

      - run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dev-constraints }}

      - name: Edit template matches the Media Browser template
        run: >
          diff
          <(grep -v 'partial="Asset/AiClassification"' Resources/Private/Templates/Asset/Edit.html)
          Packages/Application/Neos.Media.Browser/Resources/Private/Templates/Asset/Edit.html

      - run: bin/phpunit
